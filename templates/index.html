<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混元森林 - 腾讯混元大模型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #f8faf6 0%, #e8f0e4 50%, #d4e0d0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #2d4a3e;
        }
        .header {
            background: rgba(255,255,255,0.85);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(45,74,62,0.1);
            box-shadow: 0 2px 20px rgba(45,74,62,0.08);
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #2d4a3e;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header h1::before { content: '🌿'; font-size: 28px; }
        .main-content {
            flex: 1;
            display: flex;
            max-width: 1400px;
            margin: 24px auto;
            width: 100%;
            padding: 0 20px;
            gap: 24px;
        }
        .chat-container {
            flex: 3;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(45,74,62,0.12);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(45,74,62,0.08);
        }
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-height: 550px;
        }
        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 14px;
        }
        .message.user { flex-direction: row-reverse; }
        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            border: 2px solid rgba(76,175,80,0.2);
        }
        .message.user .avatar {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
        }
        .message.assistant .avatar {
            background: rgba(76,175,80,0.08);
            color: #4CAF50;
        }
        .message-content {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.7;
            font-size: 15px;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, rgba(76,175,80,0.12), rgba(56,142,60,0.1));
            border: 1px solid rgba(76,175,80,0.2);
            border-radius: 18px 6px 18px 18px;
        }
        .message.assistant .message-content {
            background: rgba(245,248,243,0.9);
            border: 1px solid rgba(45,74,62,0.08);
            border-radius: 6px 18px 18px 18px;
        }
        .message-time {
            font-size: 11px;
            opacity: 0.4;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        .image-preview {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid rgba(76,175,80,0.15);
        }
        .input-area {
            padding: 20px 24px;
            border-top: 1px solid rgba(45,74,62,0.08);
            display: flex;
            gap: 14px;
            background: rgba(250,252,248,0.9);
        }
        .input-area input {
            flex: 1;
            padding: 15px 22px;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(76,175,80,0.2);
            border-radius: 26px;
            font-size: 15px;
            outline: none;
            color: #2d4a3e;
        }
        .input-area button {
            padding: 15px 32px;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
            border: none;
            border-radius: 26px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76,175,80,0.3);
        }
        .sidebar {
            flex: 1;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(45,74,62,0.1);
            border-radius: 20px;
            padding: 24px;
        }
        .sidebar h3 {
            font-size: 14px;
            font-weight: 600;
            color: rgba(45,74,62,0.7);
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(76,175,80,0.15);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .config-section { margin-bottom: 24px; }
        .config-section label {
            display: block;
            font-size: 12px;
            color: rgba(45,74,62,0.5);
            margin-bottom: 8px;
        }
        .config-section input, .config-section select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(245,248,243,0.8);
            border: 1px solid rgba(76,175,80,0.15);
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            color: #2d4a3e;
        }
        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(56,142,60,0.1));
            border: 1px solid rgba(76,175,80,0.3);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            color: #2d4a3e;
            margin-top: 16px;
        }
        .save-btn:hover {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
        }
        .info-box {
            background: rgba(76,175,80,0.08);
            border: 1px solid rgba(76,175,80,0.15);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: rgba(45,74,62,0.7);
            margin-bottom: 24px;
        }
        .generated-images {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }
        .image-card {
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(76,175,80,0.1);
        }
        .image-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .image-card .caption {
            padding: 12px;
            background: rgba(245,248,243,0.6);
            font-size: 12px;
            color: rgba(45,74,62,0.6);
            border-top: 1px solid rgba(76,175,80,0.08);
        }
        .typing-indicator {
            display: flex;
            gap: 6px;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: rgba(76,175,80,0.7);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        @keyframes typing {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>混元森林</h1>
            <div class="version">v1.0</div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="avatar">🌿</div>
                    <div class="message-content">
                        <span style="color: #4CAF50;">🌱</span> 你好！我是混元森林，随时为你服务。
                        <br><span class="message-time">刚刚</span>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeyup="if(event.keyCode===13)sendMessage()">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="config-section">
                <h3>API 配置</h3>
                <label>HUNYUAN_API_KEY</label>
                <input type="password" id="apiKey" placeholder="输入 API Key">
                <label>SECRET_ID</label>
                <input type="password" id="secretId" placeholder="输入 SecretId">
                <label>SECRET_KEY</label>
                <input type="password" id="secretKey" placeholder="输入 SecretKey">
                <label>模型选择</label>
                <select id="modelSelect">
                    <option value="hunyuan-turbos-latest">hunyuan-turbos-latest</option>
                    <option value="hunyuan-turbo">hunyuan-turbo</option>
                </select>
                <label>温度参数</label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                <button class="save-btn" onclick="saveConfig()">保存配置</button>
            </div>

            <div class="info-box">
                <strong>🌿 快捷命令</strong><br>
                <span style="font-size:12px;color:rgba(45,74,62,0.5);">
                    /image 描述内容 → 生成图片<br>示例: /image 森林中的小屋
                </span>
            </div>

            <h3>生成作品</h3>
            <div class="generated-images" id="generatedImages">
                <p style="color:rgba(45,74,62,0.3);font-size:13px;text-align:center;padding:20px;">暂无作品</p>
            </div>
        </div>
    </div>

    <script>
        async function loadConfig() {
            const res = await fetch('/api/config');
            const config = await res.json();
            document.getElementById('apiKey').value = config.api_key || '';
            document.getElementById('secretId').value = config.secret_id || '';
            document.getElementById('secretKey').value = config.secret_key || '';
            document.getElementById('modelSelect').value = config.model || 'hunyuan-turbos-latest';
        }

        async function saveConfig() {
            const config = {
                api_key: document.getElementById('apiKey').value,
                secret_id: document.getElementById('secretId').value,
                secret_key: document.getElementById('secretKey').value,
                model: document.getElementById('modelSelect').value,
                temperature: parseFloat(document.getElementById('temperature').value),
                max_tokens: 2048
            };
            await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });
            alert('配置已保存');
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const chatMessages = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = `<div class="avatar">🌿</div><div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
            chatMessages.appendChild(typingDiv);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const result = await res.json();
                chatMessages.removeChild(typingDiv);

                if (result.success) {
                    if (result.type === 'image') {
                        addImageMessage(result.image_url, result.prompt);
                        addGeneratedImage(result.image_url, result.prompt);
                    } else {
                        addMessage(result.response, 'assistant');
                    }
                } else {
                    addMessage('<span style="color:#c62828;">✗</span> ' + result.error, 'assistant');
                }
            } catch (e) {
                chatMessages.removeChild(typingDiv);
                addMessage('<span style="color:#c62828;">✗</span> ' + e.message, 'assistant');
            }
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function addMessage(content, role) {
            const chatMessages = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = role === 'user' ? '👤' : '🌿';
            const now = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
            div.innerHTML = `<div class="avatar">${avatar}</div><div class="message-content">${content}<br><span class="message-time">${now}</span></div>`;
            chatMessages.appendChild(div);
        }

        function addImageMessage(imageUrl, prompt) {
            const chatMessages = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message assistant';
            const now = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
            div.innerHTML = `<div class="avatar">🌿</div><div class="message-content"><span style="color:#4CAF50;">🎨</span> 图片生成成功<br><span style="font-size:13px;color:rgba(45,74,62,0.5);">提示词: ${prompt}</span><br><img src="${imageUrl}" class="image-preview"><br><span class="message-time">${now}</span></div>`;
            chatMessages.appendChild(div);
        }

        function addGeneratedImage(imageUrl, prompt) {
            const container = document.getElementById('generatedImages');
            if (container.querySelector('p')) container.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `<img src="${imageUrl}" alt="${prompt}"><div class="caption">${prompt}</div>`;
            container.insertBefore(card, container.firstChild);
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
